[project]
name = "cx-wealthy"
version = "0.1.1"
description = "Cxalio Rich UI component library — declarative structured document rendering for terminal applications."
readme = "README.md"
authors = [{ name = "xiii_1991", email = "xiii_1991@163.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "rich>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cx_wealthy"]
