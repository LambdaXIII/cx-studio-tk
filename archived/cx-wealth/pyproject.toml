[project]
name = "cx-wealth"
version = "0.9.0"
description = "Cxalio Rich UI component library — declarative CLI interface components for terminal applications."
readme = "README.md"
authors = [{ name = "xiii_1991", email = "xiii_1991@163.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "cx-studio",
    "rich>=14.0.0",
]

classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]

[project.scripts]
cx-wealth = "cx_wealth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["cx_wealth"]
include = ["cx_wealth/locales/**/*.mo"]
